<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#080810"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff1a75"/>
      <stop offset="50%" stop-color="#9b5de5"/>
      <stop offset="100%" stop-color="#00b4ff"/>
    </linearGradient>
  </defs>
  <!-- Camera body -->
  <rect x="110" y="180" width="292" height="210" rx="32" fill="url(#g)"/>
  <!-- Lens ring -->
  <circle cx="256" cy="285" r="72" fill="#080810" stroke="white" stroke-width="6"/>
  <circle cx="256" cy="285" r="50" fill="#1a1a2e" stroke="white" stroke-width="3"/>
  <circle cx="256" cy="285" r="26" fill="url(#g)" opacity=".7"/>
  <!-- Flash -->
  <rect x="200" y="165" width="60" height="24" rx="8" fill="white" opacity=".85"/>
  <!-- Viewfinder -->
  <rect x="320" y="195" width="50" height="30" rx="6" fill="rgba(255,255,255,.3)"/>
  <!-- Shutter button -->
  <circle cx="256" cy="415" r="22" fill="white"/>
  <circle cx="256" cy="415" r="14" fill="url(#g)"/>
  <!-- Sparkles -->
  <text x="380" y="170" font-size="48" fill="white" opacity=".8">✨</text>
  <text x="90" y="420" font-size="36" fill="white" opacity=".6">📸</text>
</svg>
